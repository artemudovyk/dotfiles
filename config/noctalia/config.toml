[accessibility]
ui_scale = 1.1

[backdrop]
enabled = true

[bar.default]
background_opacity = 0.34999999217689037
center = ["clock"]
end = [
    "tray",
    "network",
    "bluetooth",
    "volume",
    "battery",
    "session",
]
margin_ends = 0
scale = 1.1
start = ["workspaces", "nix-monitor", "ram"]

[control_center]
hidden_tabs = ["weather"]
sidebar_section = "none"

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "caffeine"

[dock]
background_opacity = 1.0
enabled = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = ["lockscreen-login-box@eDP-1"]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
box_height = 196.0
box_width = 810.0
cx = 960.0
cy = 898.0
output = "eDP-1"
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[notification]
background_opacity = 1.0

[osd]
background_opacity = 1.0

[plugins]
enabled = ["avivbintangaringga/nix-monitor", "noctalia/wallhaven"]

[shell]
font_family = "Comic Shanns Mono Nerd Font"
polkit_agent = true

[shell.greeter_sync]
auto_sync = true

[shell.launcher]
categories = false
compact = true

[shell.panel]
control_center_position = "center"

[theme]
custom_palette = "stylix"
mode = "dark"
source = "custom"

[wallpaper]
directory = "/home/parven/pi-nix/wallpapers"
enabled = true

[widget.battery]
show_label = false

[widget.media]
album_art_only = true

[widget.network]
show_label = false

[widget.nix-monitor]
capsule = true
capsule_opacity = 0.5
capsule_padding = 15
capsule_radius = "auto"
show_text = false
type = "avivbintangaringga/nix-monitor:nix-monitor"

[widget.ram]
capsule = true
capsule_opacity = 0.5

[widget.volume]
show_label = false

[widget.w-engine-widget]
type = "tadomika_ari/w-engine:w-engine-widget"

[widget.workspaces]
style = "minimal"
